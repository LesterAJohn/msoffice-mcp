services:
  app:
    image: node:20
    working_dir: /workspace
    command: sh -c "npm install && npm run start:http"
    environment:
      APP_NAME: ${APP_NAME:-msoffice}
      GRAPH_API_BASE_URL: ${GRAPH_API_BASE_URL:-https://graph.microsoft.com/v1.0}
      GRAPH_API_BETA_BASE_URL: ${GRAPH_API_BETA_BASE_URL:-https://graph.microsoft.com/beta}
      GRAPH_DEFAULT_SCOPE: ${GRAPH_DEFAULT_SCOPE:-default}
      GRAPH_DEFAULT_USER_ID: ${GRAPH_DEFAULT_USER_ID:-default}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-msoffice-mcp}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-0.1.0}
      MCP_ALLOW_SENSITIVE_OUTPUT: ${MCP_ALLOW_SENSITIVE_OUTPUT:-false}
      MCP_ADMIN_AUTH_KEY: ${MCP_ADMIN_AUTH_KEY:-}
      MCP_TRANSPORT_MODE: http
      MCP_CONFIG_DEFAULT_USER_ID: ${MCP_CONFIG_DEFAULT_USER_ID:-default}
      MCP_HTTP_HOST: ${MCP_HTTP_HOST:-0.0.0.0}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-3000}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/mcp}
      MCP_HTTP_HEALTH_PATH: ${MCP_HTTP_HEALTH_PATH:-/healthz}
      MCP_HTTP_AUTH_MODE: ${MCP_HTTP_AUTH_MODE:-token}
      MCP_HTTP_AUTH_TOKENS: ${MCP_HTTP_AUTH_TOKENS:-replace-me-token}
      MCP_HTTP_TRUST_PROXY: ${MCP_HTTP_TRUST_PROXY:-false}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-}
      MCP_HTTP_ALLOWED_IPS: ${MCP_HTTP_ALLOWED_IPS:-}
      MCP_HTTP_MAX_BODY_BYTES: ${MCP_HTTP_MAX_BODY_BYTES:-1048576}
      MCP_HTTP_RATE_LIMIT_WINDOW_MS: ${MCP_HTTP_RATE_LIMIT_WINDOW_MS:-60000}
      MCP_HTTP_RATE_LIMIT_MAX_REQUESTS: ${MCP_HTTP_RATE_LIMIT_MAX_REQUESTS:-60}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      VAULT_ADDR: ${VAULT_ADDR}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_WRITE_RETRY_ATTEMPTS: ${VAULT_WRITE_RETRY_ATTEMPTS:-3}
      VAULT_WRITE_RETRY_BASE_DELAY_MS: ${VAULT_WRITE_RETRY_BASE_DELAY_MS:-200}
      VAULT_WRITE_RETRY_MAX_DELAY_MS: ${VAULT_WRITE_RETRY_MAX_DELAY_MS:-2000}
    volumes:
      - ./:/workspace
    ports:
      - "3000:3000"
